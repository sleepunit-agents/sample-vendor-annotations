[[instrument]]
id      = "piano"
family  = "keys"
aliases = ["piano", "pianos", "grand piano", "upright piano", "electric piano", "rhodes", "wurli", "wurlitzer", "epiano", "e piano"]

[[instrument]]
id      = "organ"
family  = "keys"
aliases = ["organ", "organs", "hammond", "vox organ"]

[[instrument]]
id      = "keys"
family  = "keys"
aliases = ["key", "keys", "keyboard", "clav", "clavinet", "harpsichord", "celeste"]

[[instrument]]
id      = "mallet"
family  = "keys"
aliases = ["mallet", "mallets", "marimba", "vibraphone", "vibes", "xylophone", "kalimba"]

[[instrument]]
id      = "bell"
family  = "keys"
aliases = ["bell", "bells", "chime", "chimes", "glockenspiel", "tubular bells"]

# ---- synth voices -------------------------------------------------------

[[instrument]]
id      = "lead"
family  = "synth"
aliases = ["lead", "leads", "lead synth", "hoover", "hoovers", "acid", "riff", "riffs"]

[[instrument]]
id      = "pad"
family  = "synth"
aliases = ["pad", "pads", "atmosphere", "atmospheres", "wash", "drone", "drones", "ambient", "ambience", "texture", "textures"]

[[instrument]]
id      = "pluck"
family  = "synth"
aliases = ["pluck", "plucks", "plucked"]

[[instrument]]
id      = "stab"
family  = "synth"
aliases = ["stab", "stabs", "chord stab", "chord stabs", "chord", "chords"]
# NOT "hit"/"hits": vendors use those for one-shots in general ("01. Individual
# Hits"), which would swallow lasers, whistles and sticks.

[[instrument]]
id      = "arp"
family  = "synth"
aliases = ["arp", "arps", "arpeggio", "arpeggios", "sequence", "sequences", "seq"]

[[instrument]]
id      = "synth"
family  = "synth"
aliases = ["synth", "synths", "synthesizer", "poly", "mono synth", "tonal", "melodic"]

# ---- acoustic / recorded ------------------------------------------------

[[instrument]]
id      = "guitar"
family  = "strings"
aliases = ["guitar", "guitars", "acoustic guitar", "electric guitar", "gtr"]

[[instrument]]
id      = "violin"
family  = "strings"
aliases = ["violin", "violins", "fiddle", "fiddles"]

# viola after violin: both whole-word, no overlap, but keep the section
# ordered piece-before-family like drums.
[[instrument]]
id      = "viola"
family  = "strings"
aliases = ["viola", "violas"]

[[instrument]]
id      = "cello"
family  = "strings"
aliases = ["cello", "cellos"]

[[instrument]]
id      = "harp"
family  = "strings"
aliases = ["harp", "harps"]
avoid   = ["blues harp", "mouth harp", "jaw harp", "jews harp"]   # those are harmonicas

[[instrument]]
id      = "strings"
family  = "strings"
aliases = ["string", "strings", "orchestra", "orchestral"]

[[instrument]]
id      = "trumpet"
family  = "brass"
aliases = ["trumpet", "trumpets"]

[[instrument]]
id      = "trombone"
family  = "brass"
aliases = ["trombone", "trombones"]

# sax files with brass, not woodwind: vendors put it in the horn section
# ("Brass & Sax", "Horns") and that grammar is what this file transcribes.
[[instrument]]
id      = "sax"
family  = "brass"
aliases = ["sax", "saxes", "saxophone", "saxophones"]
avoid   = ["brass sax", "sax brass"]   # "Brass & Sax" section folders are the whole section

[[instrument]]
id      = "tuba"
family  = "brass"
aliases = ["tuba", "tubas", "sousaphone"]

# "horn"/"horns" stays in the catch-all: a vendor's "Horns" folder is
# usually the whole section, not french horns.
[[instrument]]
id      = "brass"
family  = "brass"
aliases = ["brass", "horn", "horns"]
avoid   = ["english horn"]   # that one is the oboe entry, listed below

[[instrument]]
id      = "flute"
family  = "woodwind"
aliases = ["flute", "flutes", "piccolo", "pan pipes", "panpipes"]

[[instrument]]
id      = "clarinet"
family  = "woodwind"
aliases = ["clarinet", "clarinets"]

[[instrument]]
id      = "oboe"
family  = "woodwind"
aliases = ["oboe", "oboes", "cor anglais", "english horn"]

[[instrument]]
id      = "bassoon"
family  = "woodwind"
aliases = ["bassoon", "bassoons"]

[[instrument]]
id      = "recorder"
family  = "woodwind"
aliases = ["recorder", "recorders"]
avoid   = ["tape recorder", "field recorder", "voice recorder"]

[[instrument]]
id      = "woodwind"
family  = "woodwind"
aliases = ["woodwind", "woodwinds"]

# ---- voice --------------------------------------------------------------

[[instrument]]
id      = "vocal"
family  = "vocal"
aliases = ["vocal", "vocals", "vox", "voice", "voices", "acapella", "a capella", "spoken", "choir", "choirs", "chant", "chants", "adlib", "adlibs"]

# ---- non-instrumental material -----------------------------------------
# The generic fx catch-all. Specific FX types (riser, impact, sweep, …)
# live at the TOP of this file — see the note there. This entry stays
# last so ambiguous words ("noise", "reverse") only win when nothing
# more specific spoke.

[[instrument]]
id      = "fx"
family  = "fx"
aliases = ["fx", "sfx", "effect", "effects", "reverse", "noise"]

