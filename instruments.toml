[[instrument]]
id      = "strings"
family  = "strings"
aliases = ["string", "strings", "orchestra", "orchestral"]

[[instrument]]
id      = "trumpet"
family  = "brass"
aliases = ["trumpet", "trumpets"]

[[instrument]]
id      = "trombone"
family  = "brass"
aliases = ["trombone", "trombones"]

# sax files with brass, not woodwind: vendors put it in the horn section
# ("Brass & Sax", "Horns") and that grammar is what this file transcribes.
[[instrument]]
id      = "sax"
family  = "brass"
aliases = ["sax", "saxes", "saxophone", "saxophones"]
avoid   = ["brass sax", "sax brass"]   # "Brass & Sax" section folders are the whole section

[[instrument]]
id      = "tuba"
family  = "brass"
aliases = ["tuba", "tubas", "sousaphone"]

[[instrument]]
id      = "french-horn"
family  = "brass"
aliases = ["french horn", "french horns"]

# "Horns" in a sample pack is the section — layered, enveloped, stabbed:
# Voyetra "Layered Horns", DX100 "Soft Horns" — not a french horn, and
# not nothing either. Until 2026-09-02 the word was an alias of the brass
# catch-all, so a folder that plainly said what it was rendered
# Brass/_General. A bare "Brass" folder still does: that word is the
# family's own name and says nothing about which instrument. (Jonathan,
# "do we not have horns or translate horns to something? that seems like
# a miss", 2026-09-02.)
[[instrument]]
id      = "horns"
family  = "brass"
aliases = ["horn", "horns", "horn section", "brass section"]
avoid   = ["english horn", "french horn", "air horn", "air horns"]   # oboe entry below; french-horn above; the dancehall air horn is fx

[[instrument]]
id      = "brass"
family  = "brass"
aliases = ["brass"]

[[instrument]]
id      = "flute"
family  = "woodwind"
aliases = ["flute", "flutes", "piccolo", "pan pipes", "panpipes"]

[[instrument]]
id      = "clarinet"
family  = "woodwind"
aliases = ["clarinet", "clarinets"]

[[instrument]]
id      = "oboe"
family  = "woodwind"
aliases = ["oboe", "oboes", "cor anglais", "english horn"]

[[instrument]]
id      = "bassoon"
family  = "woodwind"
aliases = ["bassoon", "bassoons"]

[[instrument]]
id      = "recorder"
family  = "woodwind"
aliases = ["recorder", "recorders"]
avoid   = ["tape recorder", "field recorder", "voice recorder"]

[[instrument]]
id      = "woodwind"
family  = "woodwind"
aliases = ["woodwind", "woodwinds"]

# ---- voice --------------------------------------------------------------

# Second vocal entry: the loose words. Same id, same family — only the
# rank differs. Keys and synth sit above this so "Vox Continental" stays an
# organ and "Choir Pad" stays a pad; the words that can only mean a voice
# are in the first vocal entry above drums.
[[instrument]]
id      = "vocal"
family  = "vocal"
aliases = ["vox", "voice", "voices", "spoken", "choir", "choirs", "chant", "chants"]

# ---- weak break words --------------------------------------------------
# Second break entry: the words that mean a break only when they stand
# alone. Same id, same family, same category as the entry in the drums
# section — only the rank differs. Every real instrument sits above this,
# so "Groove Therapy Pad" is a pad, "Bass Groove 01" is a bass, "Perc
# Groove 04" is percussion; a bare "Beat 03" or "Funky Groove 12" is still
# a break, and on a one-shot it still steps aside for Drums/_General.
[[instrument]]
id       = "break"
family   = "drums"
aliases  = ["beat", "beats", "groove", "grooves", "pattern", "patterns"]
category = "loops"
# pattern: what a drum-machine vendor calls its full loops — Dr Bohm
# "Factory Patterns" / "Custom Patterns" (Bossa Nova, Foxtrot, Polka …),
# Rhythm From Mars "Full Patterns" — named for the dance, never the drum,
# so nothing above spoke and 100+ loops read Drums/_General. "Stripped
# Patterns" are stems and keep their piece words. (Jonathan, "Custom
# Patterns under Dr Bohm are definitely our breaks category", 2026-09-02.)

# ---- full loops: the whole arrangement ---------------------------------
# A full loop is everything mixed together — drums, bass, keys — and it is
# its own family (see [[family]] full) because it is not any one of them.
# Only the words that always mean that are here: a songstarter is the
# arrangement by name. "Full loop" / "Full Loops" is NOT — it means two
# things across one vendor: on Perkons and Pulsar (packs with a "Bass &
# Synth" stem folder) it is the whole arrangement; on 808 Loops and Ekko
# (every stem folder is a drum) it is the full drum-machine pattern, a
# break by our definition. A word with two meanings is silent here and
# each pack says which it meant with a [[dir]] default_instrument. A
# default, not a pin, because SFM ships "Rift Beat" and "Rift Full" side
# by side in one folder: the beat is the drum-only version and its own
# word must still win. Bare "full" is never an alias: "Hand Full 162" is
# a jungle break, "Full Beats" are drum patterns. The entry ranks last so
# a songstarter that also names a part ("Songstarter Bass …") keeps the
# part. `category` = loops for the reason break carries it. (Jonathan,
# Perkons "01. Full Loops": "beat is a break by our definition … but full
# is, well, full. it needs another top level category", 2026-09-02.)
[[instrument]]
id       = "full"
family   = "full"
aliases  = ["song starter", "song starters", "songstarter", "songstarters"]
category = "loops"

# ---- non-instrumental material -----------------------------------------
# The generic fx catch-all. Specific FX types (riser, impact, sweep, …)
# live at the TOP of this file — see the note there. This entry stays
# last so ambiguous words ("noise", "reverse") only win when nothing
# more specific spoke.

[[instrument]]
id      = "fx"
family  = "fx"
aliases = ["fx", "sfx", "effect", "effects", "reverse", "noise"]

