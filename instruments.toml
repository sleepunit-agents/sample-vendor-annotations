# Canonical instrument vocabulary — the second facet beside [[category]].
#
# WHERE THE FACTS COME FROM. Vendors already label their own material: a
# folder called "01. Bass Drum", a file called "TA_Kick_Loop_124_D.wav".
# Reading that label is transcription, not inference — the same standing as
# every other annotation here. What this file does NOT do is guess from
# audio, and it does not ask the end user to tag anything.
#
# HOW IT IS APPLIED. Consumers normalize each path segment and the filename
# stem (lowercase; order prefixes like "01. " dropped; non-alphanumerics to
# spaces; a boundary opened where a letter meets a digit, so "Kick02" and
# "BD3" read as kick 02 and bd 3, and where lower case meets a capital, so
# "StringsLowGlide" reads as strings low glide and "FMBell" as fm bell)
# and look for these aliases as whole words. The FILENAME is checked
# first, then directories deepest-first — the most specific label the vendor
# wrote wins. Entries are tried in the order below, so specific beats
# generic ("bass drum" resolves to kick before "bass" can claim it).
#
# Every label the vendor wrote is collected (filename plus each directory),
# and the winner is the one listed EARLIEST here — so order encodes
# specificity, not where the word happened to appear. That matters because
# vendors put machine names in filenames: "04. Rimshot/Rimshot TOM 31.wav"
# is a rimshot from the Roland TOM, and `rim` sits above `tom` below so it
# reads as one.
#
# `avoid` lists phrases that contain an alias but mean something else; a
# segment matching one is skipped for that instrument. `codes` are the
# drum-machine abbreviations ("bd", "sd", "cp", "hh") vendors write when
# they write nothing longer — and two letters are also what a Splice pack
# code or a genre tag looks like ("FF_CP_124_drum_loop_venice_shaker" is a
# shaker loop from the pack Club Progressive; "AU_PC_94_drum_loop_full_cp"
# is cyberpunk). So a code only speaks for a segment when no alias of any
# instrument does; where it speaks it ranks as its instrument, and
# "909 CP 01" in a Drum Hits folder is still a clap. Vendors whose naming
# needs local exceptions add [[instrument]] blocks in their own vendor.toml
# (see SCHEMA) — those are consulted before this shared lexicon.
#
# Observed against Samples From Mars (83 packs), Splice (220), Polyend (23),
# Zero-G, Blu Mar Ten, Rhythm Lab, Elektron factory content, 2026-08-17.

# ---- families: rendering knowledge -------------------------------------
# `flat = true` marks a family whose output tree does NOT split by
# instrument: just <Family>/<Loops|One-Shots|_Unsorted>/<pack>. Bass and
# synth sub-typing (sub/reese, lead/pad/pluck) reads genre jargon out of
# filenames — not reliable enough to fight samples over; vocal has no
# real sub-instruments; fx typing (riser/impact/sweep) is the same
# filename matching, so it gets the same honesty. The instrument entries
# below still resolve and still land in harvest metadata — flat only
# stops the folder split, so flipping a family back is deleting one line
# here. A single entry can opt out with `split = true` (see upright-bass):
# a genuinely named acoustic instrument inside an otherwise-jargon family. Families without a block keep their instrument level (drums,
# percussion, keys, strings, brass, woodwind: literal names, reliably
# written).

[[family]]
id   = "bass"
flat = true

[[family]]
id   = "synth"
flat = true

[[family]]
id   = "vocal"
flat = true

[[family]]
id   = "fx"
flat = true

# A full loop is the whole arrangement — drums, bass, keys, whatever the
# vendor mixed down together — and it is a top-level family because it is
# not any one of those. Flat: there is no instrument to split it by; the
# point of the thing is that it is all of them. (Jonathan, Perkons "01.
# Full Loops", 2026-09-02.)
[[family]]
id   = "full"
flat = true

# ---- transition / sfx material: listed first on purpose ----------------
# FX-ness beats instrument-ness: a "Flute Riser" is a riser someone made
# with a flute, and a producer browsing flutes doesn't want it — it
# belongs with the other risers. These words are near-unambiguous FX
# labels, so they outrank every instrument below. The generic fx/effect
# catch-all stays at the BOTTOM of this file so "Noise Bass" still reads
# as bass.

[[instrument]]
id      = "riser"
family  = "fx"
aliases = ["riser", "risers", "uplifter", "uplifters"]

[[instrument]]
id      = "downlifter"
family  = "fx"
aliases = ["downlifter", "downlifters"]

[[instrument]]
id      = "impact"
family  = "fx"
aliases = ["impact", "impacts", "braam", "braams", "braaam", "braaams"]
# a braam is the trailer-house cinematic hit (Function Loops
# "FL_CC_Braaam_Loops"; Splice library 2026-09-02). "boom" was tried the
# same day and backed out: in the house listing it is a flavour, not a
# thing — "Tom Boom", "Kick_Boom", "Boom Bap", Jungle Warfare's "Boom
# 161.5" drum loops — and 44 files left their pieces for it.

[[instrument]]
id      = "sweep"
family  = "fx"
aliases = ["sweep", "sweeps", "whoosh", "whooshes"]

[[instrument]]
id      = "transition"
family  = "fx"
aliases = ["transition", "transitions", "spinback", "spinbacks"]

[[instrument]]
id      = "siren"
family  = "fx"
aliases = ["siren", "sirens"]

# Sound-design packs name the thing that made the noise, and "break" is
# among those names: "glass break", "breaking glass". That is a foley
# hit, not a drum break, and it must be read here — above the break
# entry — or the drum word claims it. Only the paired forms are listed:
# bare "glass" is a synth timbre ("Glass Pad", "Glass Bells"), and this
# entry outranks every instrument. (Observed: Epic Stock Media
# "ESM_SG_fx_explosions_debris_glass_break_hit_01" filed as a break,
# 2026-09-01. The same phrase is an `avoid` on the loops entry in
# categories.toml, or the break word would still call the file a loop.)
[[instrument]]
id      = "foley"
family  = "fx"
aliases = ["foley", "field recording", "field recordings", "found sound", "found sounds", "asmr",
           "glass break", "glass breaks", "glass breaking", "break glass", "breaking glass",
           "glass shatter", "glass shatters", "glass smash", "debris"]

# ---- vocal: the unambiguous words, above drums ---------------------------
# Same logic as the FX section: "Vocal Loop Jack To The Beat" is a vocal
# loop, and a producer browsing breaks doesn't want it — the word "vocal"
# says what the recording IS, "beat" is just the title. So the words that
# only ever mean a voice outrank the drum vocabulary. The loose ones
# ("vox" is also an organ and an amp, "voice" a synth voice, "choir" a pad)
# stay in the second vocal entry near the bottom, where keys and synth
# still beat them. (Observed: Splice "02_TA_Vocal_Loop_Jack_To_The_Beat_126"
# filed under Break, 2026-09-01.)

[[instrument]]
id      = "vocal"
family  = "vocal"
aliases = ["vocal", "vocals", "acapella", "a capella", "acappella", "adlib", "adlibs", "ad lib", "ad libs", "spoken word"]

# ---- drums: pieces first, families later -------------------------------

[[instrument]]
id      = "kick"
family  = "drums"
aliases = ["kick", "kicks", "bass drum", "bassdrum", "kik", "bass drums"]
codes   = ["bd"]
avoid   = ["kick bass", "kickbass",   # a bass patch named for its kick pairing
           "no kick", "no kicks", "kickless", "without kick"]   # a loop WITHOUT one is a top (below)

[[instrument]]
id      = "snare"
family  = "drums"
aliases = ["snare", "snares", "snare drum"]
codes   = ["sd", "sn"]

[[instrument]]
id      = "clap"
family  = "drums"
aliases = ["clap", "claps", "handclap", "hand clap"]
# "snap" is a clap too, but it is a second clap entry ranked below the
# percussion pieces — see the note there.
codes   = ["cp"]

# "Cymbals and Hats" holds both, so neither word may claim it — hat outranks
# cymbal here, so without a rule every crash and ride in such a folder reads
# as a hi-hat. Consumers handle that generally now (a segment naming two
# different instruments across an "and"/"&"/"+" claims neither; the filename
# decides, and what is left is the shared family), so no per-phrase `avoid`
# is needed here or for "Clap and Snare", "Pluck and Lead", "Texture and FX".
[[instrument]]
id      = "hat"
family  = "drums"
aliases = [
  "hat", "hats", "hi hat", "hihat", "hi hats", "hihats",
  "closed hat", "closed hats", "open hat", "open hats", "ohh", "chh",
]
# "tops" is deliberately NOT here. It names a layer (hats + percussion
# over a beat), not a piece, and an entry this high would outrank the
# real piece in the file name — "02. Tops/Clave Slider Ekko Color 140.wav"
# is a clave, "07. Tom Combos/TomCombos_Tops_909Loops_05.wav" a tom
# (probed 2026-09-01 across the whole archive). Tops are their own entry,
# ranked with fill — see `top` below the percussion pieces.
codes   = ["hh"]

[[instrument]]
id      = "cymbal"
family  = "drums"
aliases = ["cymbal", "cymbals", "crash", "crashes", "ride", "rides", "splash"]

# rim before tom: "Rimshot TOM 12" is a rimshot, and "TOM" is a machine
# name that lands in every filename of Samples From Mars' TOM pack.
[[instrument]]
id      = "rim"
family  = "drums"
aliases = ["rim", "rimshot", "rim shot", "rimshots", "rim shots",
           "sidestick", "side stick", "sidesticks", "side sticks",
           "cross stick", "crossstick", "cross sticks", "xstick", "x stick"]
# sidestick / cross stick: the same stroke by its other names — Lindrum
# "01. Individual Hits/03. Sidestick" read nothing (Jonathan, 2026-09-02).
# SFM's "SS" abbreviation is a vendor alias in its own file.

[[instrument]]
id      = "tom"
family  = "drums"
aliases = ["tom", "toms", "tom drum", "floor tom", "rack tom"]
# "TOM 1501" is the Formanta TOM-1501, a Soviet string synth — SFM Soviet
# Synths names seven patch folders after it ("Clav - TOM 1501", "String
# Combo 1 - TOM 1501"), and every one read as a tom (probed 2026-09-02).
avoid   = ["tom 1501"]

# break before the generic drums entry: a drum break is the more specific
# description of the two.
#
# A break is a loop by definition, and `category` says so: on a file
# already known to be a one-shot (or a multisample) these words are a
# title, not a label — a kit called "Beat" holds kicks, "Break Chop Dr
# Sample 01" is a hit cut from a break — so they step aside for every
# entry below and, when nothing else speaks, stand in for drums alone
# (the catch-all, Drums/_General). Breaks have no one-shots. (Observed:
# 808_Kick02 / 909_Kick04 from a kit named Beat filed under
# Drums/Break/One-Shots, 2026-09-01.)
#
# `beat` and `groove` are NOT here. Bare, they do mean a break ("Beat 03",
# "Funky Groove 12") — but they are also the commonest title words in
# sample-land: "Groove Therapy Pad", "Bass Groove 01", "Vocal Loop Jack To
# The Beat". A second break entry at the BOTTOM of this file carries them,
# below every real instrument, so they only speak when nothing else did.
# Paired with the drum catch-all word they are unambiguous and stay here.
# (Observed: Blu Mar Ten "Groove Therapy Pad" filed as a break, 2026-09-01.)
[[instrument]]
id       = "break"
family   = "drums"
aliases  = ["break", "breaks", "breakbeat", "breakbeats", "break beat", "break beats", "amen", "drum break", "drum breaks",
            "drum groove", "drum grooves", "drum beat", "drum beats", "drumbeat", "drumbeats",
            "beat loop", "beat loops", "groove loop", "groove loops",
            "full beat", "full beats"]
category = "loops"
# "full beat(s)": SFM's other name for a whole drum pattern — Indie Tapes
# "01. Drums/01. Full Beats", Modular Drum Loops "07. Full Beats", Lin
# Loops' file names. "full" alone is the arrangement family's word and
# ranks last, so 146 whole patterns read Drums/_General off the parent
# "Drums" until the phrase was here. (Jonathan, 2026-09-02.)

# ---- percussion ---------------------------------------------------------

[[instrument]]
id      = "shaker"
family  = "percussion"
aliases = ["shaker", "shakers", "maraca", "maracas", "cabasa"]

[[instrument]]
id      = "tambourine"
family  = "percussion"
aliases = ["tambourine", "tambourines", "tamb", "tambo", "tambos"]
# tambo: Rhythm From Mars "Tambo", MPC60 "Tambo Hi / Lo", Zero-G "Tambo Hit" (2026-09-02)

[[instrument]]
id      = "conga"
family  = "percussion"
aliases = ["conga", "congas", "bongo", "bongos", "tumbadora", "djembe"]

[[instrument]]
id      = "cowbell"
family  = "percussion"
aliases = ["cowbell", "cowbells", "cow bell", "cow bells", "cowb", "agogo"]
# cowb: SFM's short form (SP1200 / Drumtrax / Rhythm "Cowb … 01"); "cow bell"
# is what Festival's "CowBell" reads as once camel case is split

[[instrument]]
id      = "clave"
family  = "percussion"
aliases = ["clave", "claves", "guiro", "guira", "chekere", "woodblock", "wood block", "wood blocks", "claves and guiro",
           "jam block", "jamblock", "jamblok", "block", "blocks"]
# guira: the Dominican metal scraper; jam block: LP's plastic woodblock —
# Polyend Festival ships both as folders (observed 2026-09-01)
# block on its own: Wendel "11. Block" / "Block Wendel Color A", Ekko
# "Block 1", MPC60 "Block Vinyl", Zero-G "Long Block" — a bare block in a
# drum pack is the woodblock (2026-09-02). A bare "wood" is NOT here: it
# was tried the same day and took Modular Drums "Bell Wood", Frost
# "Pluck_Painting_Wood" and Found Sounds' "WoodBell" off their pieces
# (this entry outranks bell and pluck) for 36 Fractured files it got
# right — those are pinned in the pack file instead.

# Three more named pieces the drum-machine packs write as folders and the
# lexicon had no word for, so they dissolved into Percussion/_General:
# timbale (505 "11. Timbale", 626 "12. Timbale", 727 "Timbales", TOM),
# tabla and udu (MPC3000 "Tabla" / "Udu", Private Reserve "09. Percussion").
# Found by sweeping every Perc / Percussion folder in the house listing
# for the words its catch-all files carry (2026-09-02).
[[instrument]]
id      = "timbale"
family  = "percussion"
aliases = ["timbale", "timbales", "timbal", "timbala"]

[[instrument]]
id      = "tabla"
family  = "percussion"
aliases = ["tabla", "tablas"]

[[instrument]]
id      = "udu"
family  = "percussion"
aliases = ["udu", "udus"]

# Mallets are tuned percussion, and vendors file them with the drums:
# SFM 360's "06. Perc/Vibes", "06. Perc/Mallet Multi Filter". Every
# alias here was already in the file, but the entry sat in the keys
# block — BELOW the percussion catch-all — so the parent folder's "perc"
# outranked the file's own "vibes" and 297 chromatic patches read
# Percussion/_General. A vibraphone is percussion the way a piano is, so
# the family stays keys (Keys/Mallet) and the entry ranks with the named
# pieces, above the catch-alls. (Jonathan, "vibes vibrato under perc …
# it goes under mallet", 2026-09-02.)
[[instrument]]
id      = "mallet"
family  = "keys"
aliases = ["mallet", "mallets", "marimba", "vibraphone", "vibes", "xylophone", "kalimba"]

# Bells are the same case as mallets — tuned, struck, filed with the drums
# by every drum-machine vendor (SP1200 "15. Perc/Chimes", Modular Drums
# "Bell", 727 "Rides & Chimes") — and the entry sat in the keys block below
# the percussion catch-all, so a Perc folder outvoted the file's own word.
# Moved up beside mallet, family still keys (2026-09-02).
[[instrument]]
id      = "bell"
family  = "keys"
aliases = ["bell", "bells", "chime", "chimes", "glockenspiel", "tubular bells"]
avoid   = ["bell rhodes", "rhodes bell"]   # S612 "Bell Rhodes" is a Rhodes: piano ranks below this entry now

# Same folder, same rank problem: 360 "06. Perc/Timpani", SP1200
# "Factory Drums/7. Timpani". A named orchestral drum, so percussion.
[[instrument]]
id      = "timpani"
family  = "percussion"
aliases = ["timpani", "timpanis", "kettle drum", "kettle drums"]

# A finger snap is filed with the claps everywhere it appears — MPC3000
# "03. Clap & Snap", SP1200 "3. Snap", Modern Oddities "Snaps", Vinyl
# Drums and TOM "Snap" folders — but SFM also writes "Snap" as a FLAVOUR on
# a named hit: "Tamb 78 Snap", "Clave Snap Cassette", "Rim LXR Snap",
# "Bongo CR78 Snap". At the clap entry's rank the flavour word stole all
# of those (probed 2026-09-02), so snap is a second clap entry ranked here:
# below every named piece, above the catch-alls. Same id, same family.
[[instrument]]
id      = "clap"
family  = "drums"
aliases = ["snap", "snaps", "finger snap", "finger snaps", "fingersnap", "fingersnaps"]

# A fill is a role, not a piece — so it sits BELOW every named piece
# ("Snare Roll" is a snare, "percussion_loop_fill_repeating_conga" is a
# conga) and ABOVE the two catch-alls, so "percussion_loop_fill_drum_kit"
# and a "Fills" folder land in Drums/Fill rather than dissolving into
# Percussion/_General or Drums/_General. Until 2026-09-01 these words were
# break aliases, which filed a conga fill under Break. (Observed: Splice
# DECAP_DTKX_116/135, reported by Jonathan.)
[[instrument]]
id      = "fill"
family  = "drums"
aliases = ["fill", "fills", "drum fill", "drum fills", "roll", "rolls", "drum roll", "drum rolls"]

# A top is a role the same way a fill is — the layer over a beat (hats,
# shakers, percussion, the kick and snare stripped out) — so it ranks
# exactly where fill does: BELOW every named piece, so "02. Tops/Clave
# Slider Ekko Color 140" is still a clave and "TomCombos_Tops_909Loops_05"
# a tom, and ABOVE the two catch-alls, so a Tops folder of files named
# only by tempo, or a bare "Rift Top Perkons 120", lands in Drums/Top
# instead of dissolving into Drums/_General. `category` = loops for the
# reason break carries it: a top is a phrase by construction, so on a file
# already known to be a hit the word is a title ("BD Soft Top" is a kick)
# and it steps aside. A hat alias for "tops" was tried on 2026-09-01 and
# backed out — at that rank it outranked the pieces; this rank is the one
# the archive probe accepted. (Jonathan, "I'd love to pull Tops out like
# we do Fills", 2026-09-02.)
[[instrument]]
id       = "top"
family   = "drums"
aliases  = ["top", "tops", "top loop", "top loops", "toploop", "toploops",
            "percussion loop", "percussion loops", "perc loop", "perc loops", "percloop", "percloops",
            "no kick", "no kicks", "kickless", "without kick"]
category = "loops"
# "No Kick" is a top by definition — the drum loop with the kick left out
# (Trance Wave & Midtempo Glitch "Drum_Loops/No_Kick"); kick avoids the
# phrase so the word inside it cannot claim the file.
# "percussion loop" is a top by another name: a percussion phrase that is
# not a whole beat is the layer over one. The phrase ranks here, so a loop
# that names its piece keeps it ("percussion_loop_shaker_…" is a shaker
# loop, "…_fill_repeating_conga" a conga) and a fill is still a fill (the
# entry above); only the percussion loops that say nothing more land in
# Drums/Top instead of Percussion/_General. DECAP Drums That Knock X
# "Loops/Drum_Loops/Percussion_Loops", Octatrack "Extra Perc Loops" /
# "percussion loops". (Jonathan, "fill == fill, anything else == tops",
# 2026-09-02.)

# "cym" is a cymbal, but SFM also writes it as a flavour on whole
# patterns ("16 Beat Full Viscount SD Cym Break 120", "Beguine 1 Top
# Viscount Cym 120"), so a second cymbal entry carries the abbreviation
# BELOW break, fill and top — those keep their loops — and ABOVE the
# percussion catch-all, so a "Mixed Percussion" folder's "Open Cym 1" /
# "Rev Harsh Cym" / "Bass Cym" and 606's "Cym-606_A_07" read cymbal
# instead of dissolving. (Zero-G Jungle Warfare Vol 2, Jonathan,
# 2026-09-02.)
[[instrument]]
id      = "cymbal"
family  = "drums"
aliases = ["cym", "cyms"]

[[instrument]]
id      = "percussion"
family  = "percussion"
aliases = ["percussion", "perc", "percs", "percussive"]
avoid   = ["percussion top loop", "percussion top loops", "percussion and top loop", "percussion and top loops",
           "perc top loop", "perc top loops", "perc and top loop", "perc and top loops"]
# "percussion_&_top_loops" is one folder in six Zenhiser-era trance /
# techno packs (Aperture, Electro Trance, Gripping / Industrial Techno,
# Obsidian, Shadows): read as a folder naming two things it stayed silent
# (percussion vs drums, no shared family). It names one — tops — so the
# catch-all steps aside and "top loops" speaks. (Splice library, 2026-09-02)

# "Drum loop" is a break by another name — the commonest name, in fact:
# 1,870 files in the house listing say it and nothing more specific, and
# every one of them dissolved into Drums/_General because "drum" was the
# only word the lexicon heard. A third break entry carries the phrase, and
# its position is the whole rule: BELOW every named piece and the fill
# ("FF_CP_124_drum_loop_venice_shaker" is a shaker, "Drum Loop Fill 03" is
# a fill), BELOW percussion's catch-all (a Percussion folder inside a
# Drum Loops tree still says more than the tree does, and "_Perc" on a
# drum-loop stem is the percussion layer of it), and ABOVE the drums
# catch-all, which is the only word it ever displaces. (Observed:
# "01_RA_Drum_Loop_124_Full" filed as drums · loops, reported by Jonathan,
# 2026-09-02.)
[[instrument]]
id       = "break"
family   = "drums"
aliases  = ["drum loop", "drum loops", "drumloop", "drumloops", "drums loop", "drums loops"]
category = "loops"

# The generic drums entry sits BELOW the percussion pieces, not at the end
# of its own section: "drum" is the least specific word a drum vendor
# writes, and it is written everywhere — "FF_CP_124_drum_loop_venice_shaker"
# is a shaker loop, "Drum Loops/Tambourine 03" is a tambourine. Percussion's
# own catch-all outranks it too: a Percussion folder inside a Drums tree
# says more than the tree does. (Observed against Splice, 2026-09-01.)
[[instrument]]
id      = "drums"
family  = "drums"
aliases = ["drum", "drums", "drum hits", "drum one shots", "drumperc", "drum kit", "kit", "kits"]

# ---- bass ---------------------------------------------------------------

# "Sub-Urban" normalizes to "sub urban" and the bare word "sub" would claim
# it — but it's a groove name (Zero-G's jungle breaks, the artist Sub Urban),
# never a sub bass.
[[instrument]]
id      = "sub"
family  = "bass"
aliases = ["sub", "subs", "sub bass", "subbass", "808 bass", "rumble", "rumbles"]
avoid   = ["sub urban", "suburban"]
# "rumble" is the sustained sub tail DnB/techno packs ship beside their kicks
# (Polyend's "KICKS AND RUMBLE"). It is a sub, not a transient — filing it
# under Kick pollutes kick browsing. `kick` outranks this entry, so
# "Kick_Rumble_01" still reads as a kick.

[[instrument]]
id      = "reese"
family  = "bass"
aliases = ["reese", "reeses"]

# Acid is bass, not lead. The TB-303 was sold as a bass machine and every
# vendor that samples one files it that way ("Acid Synths/Basic Sub",
# "303 Bass"); a producer reaching for a 303 line is reaching for a
# bassline that squelches, and wants it beside the subs and reeses, not
# among the hoovers. Until 2026-09-01 "acid" was a lead alias, which put
# all of Acid From Mars under Synth. Bass is flat, so this splits no
# folder — it is the fact the catalog carries (`--instrument acid`), and
# `split = true` here is the one-line change if Bass/Acid/ is ever wanted.
#
# "303" is listed bare: vendors write "TB303", "TB-303" and plain "303",
# and the normalizer opens a boundary between letters and digits so all
# three read as the same word. Probed against 167k files (2026-09-01):
# no file uses a bare 303 as anything but the machine. Named drum pieces
# still win on the files of an "Acid Drums" folder because drums rank
# above this section ("Kick_Acid" is a kick). Genre phrases are avoided:
# an "Acid House" loop is a genre tag, not a 303 — the bass word, if the
# vendor wrote one, still speaks for that segment.
# (Requested by Jonathan, 2026-09-01.)
[[instrument]]
id      = "acid"
family  = "bass"
aliases = ["acid", "303", "tb 303", "tb303"]
avoid   = ["acid house", "acid techno", "acid jazz", "acid trance",
           "wav acid", "acid wav", "acidized", "acidised"]   # Sony ACIDized WAV, a format ("WAV_ACID_Essential_Flamenco_Guitars")

# The one instrument in a flat family that keeps its own folder. Bass is flat
# because sub/reese/wub is genre jargon read out of filenames — not because
# the family has no real instruments in it. An upright is a real instrument,
# recorded in a room, and nobody reaching for one wants it shuffled in with
# the 808s. `split = true` exempts this entry from the family's flat
# rendering: everything else in bass stays loose in Bass/<category>/, this
# lands in Bass/<category>/Upright Bass/.
#
# Listed ABOVE the generic bass entry so "Upright Bass" doesn't read as
# plain bass — order is specificity. "acoustic bass" is deliberately NOT an
# alias: to a jazz player it means an upright, to everyone else it means an
# acoustic bass guitar, so it stays with the generic entry rather than being
# claimed wrongly half the time.
[[instrument]]
id      = "upright-bass"
family  = "bass"
split   = true
display = "Upright Bass"
aliases = ["upright bass", "uprightbass", "double bass", "doublebass",
           "contrabass", "contra bass", "standup bass", "stand up bass",
           "string bass", "wood bass", "acoustic upright"]

[[instrument]]
id      = "bass"
family  = "bass"
aliases = ["bass", "basses", "bassline", "bass line", "bass lines", "bass hits"]
avoid   = ["bass station", "bassstation"]   # the Novation synth: Vinyl Synths names 84 patches for it, under Bass, FX and Keys alike

# ---- keys and tonal -----------------------------------------------------

[[instrument]]
id      = "piano"
family  = "keys"
aliases = ["piano", "pianos", "grand piano", "upright piano", "electric piano", "rhodes", "wurli", "wurlitzer", "epiano", "e piano", "pianet"]
# pianet: the Hohner electric piano; SFM DX100 "Digi Pianet" (observed 2026-09-02)

[[instrument]]
id      = "organ"
family  = "keys"
aliases = ["organ", "organs", "hammond", "vox organ", "harmonium", "farfisa"]
# harmonium: a reed organ; SFM Mini "Harmonium" (observed 2026-09-02). Acid's
# "Harmonium Sine" stays acid — the folder word ranks earlier.

# The clavinet is a named keyboard, and vendors write it constantly:
# SFM DX100 "Easy Clav" / "Fuzz Clav", OB "Clav Funk", Junos "01. Keys/
# Clav", S612 "Rhodes & Clav", Soviet Synths "Clavinet - MAESTRO" — 1,085
# paths in the house listing. Until 2026-09-02 the word was an alias of
# the keys catch-all, so all of them rendered Keys/_General. (Jonathan,
# "we should be able to stick clav stuff somewhere automatically".)
[[instrument]]
id      = "clav"
family  = "keys"
aliases = ["clav", "clavs", "clavinet", "clavinets", "clavi"]

# The harpsichord is a named keyboard the same way the clav is: SFM DX100
# "Harpsichord" / "Harpsi FM", Voyetra "New Age Harpsichord" — 360 paths in
# the house listing, every one a multisample the vendor named for the
# instrument. Until 2026-09-02 both words were aliases of the keys
# catch-all, so all of them rendered Keys/_General. (Jonathan, "harpsichord
# feels like one we should just be grabbing".)
[[instrument]]
id      = "harpsichord"
family  = "keys"
aliases = ["harpsichord", "harpsichords", "harpsi", "cembalo"]
# harpsi: vendor short form; SFM DX100 "Harpsi FM" (observed 2026-09-02).
# cembalo: the German / Italian name, Kontakt-era library spelling (0 in the
# house listing; kept so the word has a home when it arrives).

[[instrument]]
id      = "keys"
family  = "keys"
aliases = ["key", "keys", "keyboard", "keyboards", "celeste"]

# ---- synth voices -------------------------------------------------------

[[instrument]]
id      = "lead"
family  = "synth"
aliases = ["lead", "leads", "lead synth", "hoover", "hoovers", "riff", "riffs"]
# "acid" is NOT here any more: it is a bass entry (2026-09-01, Jonathan).

# Synth vox: the choir-y, vocoded, human-voice-section sounds a synth
# makes — VP330 Ensemble Male / Female, its SVC-350 vocoder, "Vox Choir",
# "Synth Voice" — as against a recording of a person, which is the vocal
# family. Synth is flat, so this is the one entry in it that keeps a
# folder (`split`, like upright-bass): Synth/<category>/Synth Vox/. Was
# the `vocoder` entry until 2026-09-02; same rank, wider words. (Jonathan,
# "do we have like a synth vox category? … maybe like our vocoder group?")
[[instrument]]
id      = "synth-vox"
family  = "synth"
split   = true
display = "Synth Vox"
aliases = ["vocoder", "vocoders", "vocoded",
           "synth vox", "synth voice", "synth voices", "synth choir", "synth choirs",
           "vox synth", "voice synth", "choir synth", "vox choir"]

# A choir you can PLAY is a synth vox — Mirage / Emulator "Choir" are
# chromatic patches, the archetypal choir-y sound — and a choir you can
# only listen to is a vocal. `category` draws that line the way it does
# for break: on a file already known to be a loop or a hit the word is
# passed over here and the loose vocal entry near the bottom reads it.
[[instrument]]
id       = "synth-vox"
family   = "synth"
aliases  = ["choir", "choirs"]
category = "multisamples"

[[instrument]]
id      = "pad"
family  = "synth"
aliases = ["pad", "pads", "atmosphere", "atmospheres", "atmos", "atmo", "wash", "drone", "drones", "ambient", "ambience", "ambiences", "ambiance", "ambiances", "texture", "textures"]
# "atmos" is the sample-pack short form of atmosphere (Sample Magic
# "cinematic atmos", Origin Sound "Atmos Pads"; observed 2026-09-01)

[[instrument]]
id      = "pluck"
family  = "synth"
aliases = ["pluck", "plucks", "plucked"]

[[instrument]]
id      = "stab"
family  = "synth"
aliases = ["stab", "stabs", "chord stab", "chord stabs", "chord", "chords"]
# NOT "hit"/"hits": vendors use those for one-shots in general ("01. Individual
# Hits"), which would swallow lasers, whistles and sticks.

[[instrument]]
id      = "arp"
family  = "synth"
aliases = ["arp", "arps", "arpeggio", "arpeggios", "sequence", "sequences", "seq"]
# ARP the company, not the arpeggio: SFM writes the machine into every
# 2600 and Omni filename ("100_AllOfMyBass_ARP2600_E6"), and with the
# camel-case split reading the patch names, the bass/lead/pad word must
# not lose to the maker's (2026-09-02)
avoid   = ["arp 2600", "arp2600", "arp 2500", "arp odyssey", "arp omni", "arp solina", "arp axxe", "arp quadra", "arp instruments"]

[[instrument]]
id      = "synth"
family  = "synth"
aliases = ["synth", "synths", "synthesizer", "poly", "mono synth", "tonal", "melodic"]

# ---- acoustic / recorded ------------------------------------------------

[[instrument]]
id      = "guitar"
family  = "strings"
aliases = ["guitar", "guitars", "acoustic guitar", "electric guitar", "gtr"]

[[instrument]]
id      = "violin"
family  = "strings"
