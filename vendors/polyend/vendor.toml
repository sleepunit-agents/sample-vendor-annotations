# Polyend — Palette sample packs (polyend.com/palettes). Observed against a
# full set of 23 packs downloaded 2026-08 and unzipped one dir per pack.
# The packs are sold per title on a WooCommerce store; nothing here is the
# vendor's copy — titles/URLs/image pointers only.

[vendor]
name     = "Polyend"
slug     = "polyend"
aliases  = ["Polyend Palette", "Palette"]
homepage = "https://polyend.com"
role     = "house"
domains  = ["polyend.com", "polyend-website.fra1.digitaloceanspaces.com"]   # hosts pointers may use (lint L1; proposed 2026-08-19)
observed = 2026-08-16

[packs]
grammar     = "top-level-dirs"     # one dir per unzipped pack
dir_pattern = "*"                  # pack title as the dir name ("Bass Tools", "Greystate")
sibling_zip = "archival-original"
zip_name_grammar = "<Title-With-Hyphens>-<6 lowercase alnum>.zip, e.g. Bass-Tools-mkqzad.zip, GreyState-uxmeci.zip. Internal root VARIES by vintage: a <Title>/ folder (ASMR, Halogen, Collapse…), bare format trees at zip root (Trio, Snap, Pulse…), a nested <Title>/ plus __MACOSX (Fractured), or three inner zips one per format tree (Thump)."

[formats]
# Every pack ships the same one-shots three ways; 24-bit stereo is the
# master, the 16-bit trees are cut for the Tracker/Play/Mini (16-bit
# engines, mono preferred). Tree names carry the pack title or the literal
# word "Pack": "ASMR 24 bit stereo" vs "Pack 24 bit stereo".
canonical_dir      = "* 24 bit stereo"
parallel_dirs      = ["* 16 bit mono", "* 16 bit stereo", "*Step Kits*", "Tracker PTI kits"]
sidecar_extensions = [".pti", ".pdf"]   # Tracker instruments; the licensing agreement
# Exceptions: Heights and MNML have no format level — category dirs at
# pack root, one cut only.

[[category]]
id    = "one-shots"
match = ["* 24 bit stereo", "* 16 bit stereo", "* 16 bit mono", "Downlifter", "FX", "Impact", "Riser", "Transitions", "bass", "clap and snare", "hats", "kicks and rumble", "percussion", "synths", "*Step Kits*", "Tracker PTI kits",
         "cymbals and hats", "kicks", "snares", "mids", "perc", "stab", "stabs", "pluck and lead", "leads and stabs", "texture and fx",
         "electric piano", "guitar", "upright bass"]
# The second row is Palette category dirs observed beyond Bass Tools, incl.
# Trio's instrument-named ones. They matter only for Heights and MNML, whose
# packs have no format level for the first entry to catch — everywhere else
# the "* 24 bit stereo" tree already says one-shots.
# the Step Kits / PTI dirs are device kit presets sliced from the same
# one-shots — kits are one-shots (separate id retired 2026-08-30)

[naming]
# Files are <category>_<name>[_<n>].wav ("kit_bearings_1.wav",
# "Atmosphere_Alarm.wav"); numbered variations count up at the tail.
take_suffix = "_N"

# Instrument overrides: Polyend's own folder words that the shared lexicon
# would otherwise read generically.
#
# "KICKS AND RUMBLE" and "CLAP AND SNARE" used to be pinned here, to kick and
# snare — which quietly filed every rumble as a kick and every clap as a
# snare. A folder naming two things is a label for neither: the general
# compound rule now refuses both words and lets the filename decide, so the
# pins are gone. Pin a compound phrase here only when the vendor really does
# mean one instrument by it.

# "MIDS" is Bass Tools' (and any DnB Palette's) word for mid bass — the layer
# between the sub and the top end. It's genre jargon, not a general label, so
# it stays vendor-local rather than going in the shared lexicon; the bass
# family is flat, so it renders under Bass either way.
# Observed 2026-08-30 from a real copy: Bass Tools' category dirs are
# BASS, CYMBALS AND HATS, FX, KICKS, MIDS, SNARES.
[[instrument]]
id      = "bass"
aliases = ["mids", "mid bass", "mid basses", "midbass"]
