# The VP-330 is a strings-and-human-voice machine, and SFM named every
# WAV patch folder in camel case with no spaces ("StringsLowGlide",
# "EnsembleMaleVibe1"), which the lexicon reads as one long word. These
# defaults say what the folder names say. Strings folders are plain
# strings; the Ensemble folders are the Human Voice section — a choir-y
# synth, not a singer — as is the SVC-350 vocoder material.
