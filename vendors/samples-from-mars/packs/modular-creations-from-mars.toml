# Dir map (observed 2026-09-01). No WAV level: the numbered dirs sit at
# pack root. "1. Modular Loops (120 BPM)" reads as loops on its own.
# "2. Modular Drones" and "3. Modular Raw Voltage" are untempo'd sustained
# recordings ("DarkModulator_Drones_08.wav", "DPO_RawVoltages_13.wav") —
# every tempo'd thing in this pack is under the loops dir, so these are
# pinned one-shots. "4. Modular Instruments" nests Kontakt 5.5 / Ableton
# Live trees (host packaging of the same material) and "5. Docs" is docs.
# The format level sits one dir DOWN in this pack: "1. Modular Loops
# (120 BPM)" holds WAV, Apple Loops (.aif) and REX2 (.rx2) renders of the
# same 143 loops, so the vendor's top-level globs never see them and a
# consumer that strips trees at pack root only kept all three. Nested
# roles are honoured by materialized-tunes from v0.9.38; the .aif set is
# SFM's own host prep and is skipped where the WAV survives. (Jonathan,
# "apple loops bullshit that isn't getting deduped … straight ignore
# that shit", 2026-09-02.)
