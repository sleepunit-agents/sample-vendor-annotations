# "01. Full Loops" here is the whole arrangement: the loop stems beside it
# include a "Bass & Synth" folder, so a Full is drums plus the tonal
# parts mixed. A default, not a pin, because the folder also holds the
# drum-only "… Beat …" version of each groove and that word must keep
# winning (a beat is a break). The shared lexicon is silent on "full
# loops" on purpose — on 808 Loops / Ekko the same folder name means the
# full drum pattern. (Jonathan, "beat is a break by our definition … but
# full is, well, full", 2026-09-02.)
[[dir]]
path               = "WAV/02. Loops/01. Full Loops"
default_instrument = "full"
