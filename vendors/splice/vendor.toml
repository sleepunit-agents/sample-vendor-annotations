# Splice — a distributor, not a label: packs here are BY many providers
# (Sample Magic, Zenhiser, Black Octopus...), so pack files carry a
# `provider` field. Observed against a Splice desktop-app library
# (~/Splice/sounds/packs), 2026-07-26.

[vendor]
name     = "Splice"
slug     = "splice"
homepage = "https://splice.com"
role     = "marketplace"
domains  = ["splice.com"]   # hosts pointers may use (lint L1; proposed 2026-08-19)
observed = 2026-07-26

[packs]
grammar  = "top-level-dirs"
resolver = "splice-graphql"   # marketplace: no per-pack files here — see below
# Splice is a marketplace: its pack list is unbounded and grows daily, and
# every user's local library is a different partial subset (the app
# downloads per sample). Shipping per-pack files here would never be
# complete and would swamp the repo — so this vendor ships GRAMMAR only,
# and consumers resolve each pack they actually have from Splice's public
# GraphQL (surfaces-graphql.splice.com), caching locally:
#
#   query($fp:String!){ assetsSearch(filter:{asset_type_slug:sample,
#     filepath:$fp}, pagination:{limit:5}) { items { ... on SampleAsset {
#     name parents(filter:{asset_type_slug:pack}) { items { ... on PackAsset {
#     name uuid permalink_slug permalink_base_url provider { name
#     permalink_slug } tags { label } files { url asset_file_type_slug }
#   } } } } } } }
#
# $fp is a sample's path within the pack dir (SampleAsset.name is exactly
# that); the parent PackAsset gives name, slug, provider, permalink base
# (base + slug = product URL) and files[cover_image].url. Unauthenticated,
# no introspection. Vendor tag labels come back too — translate via
# tags.toml. A pack Splice no longer knows was delisted after download.
# (Until 2026-08-16 this vendor carried 202 pack stubs observed from one
# library; git history has them.)

# Where the Splice desktop app keeps downloaded samples by default. A fact
# about the vendor (same class as pack grammar) — consumers use it to offer
# "you have Splice installed, add it as a source?" without crawling disks.
# Two on-disk layouts exist: older app builds keep <Splice root>/sounds/packs;
# current builds (observed on Windows 2026-08-16) keep <Splice root>/Samples/packs
# beside a `presets/` dir and a `.splice/` marker. The Splice root itself is
# relocatable in the app's preferences (a NAS share is common), so these are
# only the defaults — a `.splice/` dir is the tell for a relocated one.
[install]
macos   = ["~/Splice/sounds/packs", "~/Splice/Samples/packs"]
windows = ["~/Splice/sounds/packs", "~/Splice/Samples/packs", "~/Documents/Splice/Samples/packs"]
linux   = ["~/Splice/sounds/packs", "~/Splice/Samples/packs"]
note    = "app-managed: new samples land continuously, so rescan often"

# Category folders sit one level down: <pack>/<Label_-_Title_Audio>/<category>/.
# That wrapper restates the pack's name (mostly "<Label>_-_<Title>_Audio";
# also "91V_Ambient_Trap_Vocals", "RNT_silk_vocals", "Hard_Trap_Audio") and
# is not a label for the sounds under it — a kick in "Vocal Pop House 2"
# is a kick, a one-shot in a Function Loops pack is a one-shot. Consumers
# treat a dir that echoes the pack name as a fallback read only when the
# rest of the path said nothing (materialized-tunes v0.9.13). Some packs
# have no wrapper and put "DRUMS" / "Loops" / "One_Shots" at that depth;
# those are real labels and are read as such.
# Names vary per label; observed 2026-08-16 over 202 packs (114 distinct
# names). Matched case-insensitively by consumers. Order matters where a
# name says two things: "*loop*" beats "*drum*"/"*hit*".
[[category]]
id    = "loops"
match = ["*loop*", "*songstarter*", "*song_starter*", "*song starter*", "*construction*",
         "*demo_kit*", "*demo kit*", "*demokit*", "*song_kit*", "*song kit*", "*songkit*",
         "*music_kit*", "*music kit*", "*vocal_kit*", "*vocal kit*", "*kit*[0-9][0-9][0-9]*"]
# A kit with a tempo and a key is a song: the "Demo Kits" / "Kit03_168_F#m"
# / "FL_ST_Kit06_130_F#m" folders Function Loops, Cr2, Sample Magic and the
# Acid House & Rave / Hard Trap packs ship are construction kits — the
# song's stems as loops (a hat loop, a bass loop, a vocal loop). Before
# 2026-09-02 "*kit*" below caught them and every stem was a one-shot, the
# filename's own "Loop" notwithstanding (the folder rule speaks first).
# "*kit*[0-9][0-9][0-9]*" is the tempo in the name; a drum kit numbered
# past 99 would be caught by it, and none has been seen.

[[category]]
id    = "one-shots"
match = ["*kit*"]
# kits are one-shots; kept as its own entry (not merged below) so
# "*kit*" keeps its place in the order — drumkit folders must win
# before the fx globs run

[[category]]
id    = "one-shots"
match = ["*one_shot*", "*one-shot*", "*oneshot*", "*hit*", "*stab*", "pads", "pianos", "organs", "choirs", "hoovers", "vocals", "*_bass", "*_acid", "*_drums"]
