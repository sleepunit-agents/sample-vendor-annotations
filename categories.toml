# Shared category vocabulary — the cross-vendor fallback behind each
# vendor's own [[category]] rules.
#
# WHERE THE FACTS COME FROM. Same standing as instruments.toml: vendors
# label loop-ness in their folder and file names ("Drum Loops", "One
# Shots", "Individual Hits", "TFH_Drum_Loop_124.wav"). Reading that label
# is transcription, not inference — nothing here guesses from audio.
#
# HOW IT IS APPLIED. A vendor's own annotation goes first: a pack's
# [[dir]] map, then the vendor's [[category]] globs, then its
# dedicated_packs. Only when those say nothing does this lexicon run:
# each path segment is normalized (lowercase, order prefixes dropped,
# non-alphanumerics to spaces) and aliases are matched as whole words —
# directories deepest-first, the filename stem last, first hit wins.
# Folders are deliberate labels; filenames are noisier, so the stem only
# speaks when no folder did.
#
# Entries are tried in file order per segment: specific beats generic.
# `avoid` lists phrases that contain an alias but mean something else.
#
# Vocabulary matches SCHEMA [[category]]: one-shots, loops, multisamples.
# Extend it in a PR when a vendor genuinely doesn't fit. "Kit" words are
# one-shots aliases: a kit is a folder of one-shots, and splitting it out
# just made two piles of the same thing (retired 2026-08-30). "fx" was
# retired 2026-09-02: category says HOW a thing was recorded (a hit, a
# phrase, a keyboard's worth of notes) and fx says WHAT it is — that is
# the fx family in instruments.toml, and it was already there. As a
# category it was never a kind of recording, it was a non-answer that
# blocked the real ones: a rack filed under Presets/FX/ or a WAV/FX/
# folder of chromatic patches (SFM 101 "BigSub1", DX100 "Tubular Bells")
# read category=fx, which is non-empty, so the multisample shape never
# got to speak and the files landed in FX/_General/_Unsorted asking
# "loop or one-shot?". (Jonathan, "fx can be a loop or oneshot right? or
# even a multisample", 2026-09-02.)

[[category]]
id      = "loops"
aliases = [
  "loop", "loops", "full beats", "whole beats", "full breaks",
  "song starters", "songstarters", "construction",
]
# observed: "Drum Loops 120 BPM", "03. Loops", "Full Breaks",
# "Construction Kits" (loops entry sits above kits so the construction
# sense wins)

# A chop is a slice — a one-shot by construction — so it beats the break
# words below ("Break Chop Dr Sample 01.wav" is a hit cut from a break,
# not a break) but loses to the loop words above ("vocal_chop_loop" is a
# loop built from chops). That ordering is why loops is two entries.
# (Observed: Samples From Mars "Dr Sample", Splice vocal chops, 2026-09-01.)
[[category]]
id      = "one-shots"
aliases = ["chop", "chops", "chopped"]

[[category]]
id      = "loops"
aliases = ["break", "breaks", "breakbeat", "breakbeats", "break beats"]
avoid   = ["glass break", "glass breaks", "glass breaking", "break glass", "breaking glass"]
# observed: "Amen Break 01.wav", "Full Breaks" — a break is a loop by
# nature, so the word stands in for the category when no folder said one.
# `avoid`: a glass break is a foley hit, not a drum break — the same
# phrase is a foley alias in instruments.toml. (Observed: Epic Stock Media
# "ESM_SG_fx_explosions_debris_glass_break_hit_01", 2026-09-01.)

[[category]]
id      = "one-shots"
aliases = [
  "one shot", "one shots", "oneshot", "oneshots",
  "single shot", "single shots", "shot", "shots",
  "individual hits", "one hits", "single hits", "hit", "hits",
  "flam", "flams",
  "stab", "stabs",
  "kit", "kits", "drum kit", "drum kits", "sample kit", "sample kits",
]
# observed: "01. Individual Hits", "One Shots", "Drum Hits",
# "Snare Hit 03.wav", "Rim Shots"; a flam is one stroke — Samples From
# Mars 727 "02. Flams/Conga Lo Flam D 727 08.wav" (2026-09-01); kit words are slang for the same
# thing ("808 Kit 1" is a folder of hits) — "Construction Kits" still
# reads as loops because that entry sits above this one

# A fill is a phrase by construction — several hits in time — so the word
# stands in for the category when nothing else said one, exactly as a break
# does. It sits BELOW the hit/kit entry above, so a folder that says
# one-shots still wins: "Fills" inside a drum machine's one-shot kit stays
# a one-shot, and only an unlabelled "Fill 03.wav" or a bare "Drum Fills"
# folder reads as a loop. (Observed: Elektron Octatrack MKII factory
# content filing its fills as _Unsorted, reported by Jonathan 2026-09-01.)
# A top is a phrase by the same construction — the layer over a beat — so
# its folder words sit here too: "02. Tops/Rift Top Perkons 120" is a loop.
# Bare "top" is left out: on a stem it is as often a variant word on a hit
# ("BD Real Top A" is a kick), and the folder above it says the kind. (SFM
# Perkons, Ekko, 808 Loops, Lin Loops "Tops" folders, 2026-09-02.)
[[category]]
id      = "loops"
aliases = [
  "fill", "fills", "drum fill", "drum fills",
  "roll", "rolls", "drum roll", "drum rolls",
  "tops", "top loop", "top loops", "toploop", "toploops",
]

[[category]]
id      = "multisamples"
aliases = [
  "multisample", "multisamples", "multi sample", "multi samples",
  "instrument samples",
]

# An FX event is one hit by construction — a riser runs up to a downbeat,
# an impact lands on one, a spinback is one gesture — so the word stands
# in for the category the way a chop or a flam does. Last on purpose: a
# "Riser Loop" is a loop (loops entry first), a riser inside a folder
# that says One Shots is a one-shot for the folder's reason, and beds
# (texture, atmos, drone) are deliberately absent — a texture is as often
# a loop as a hit. So are "sweep" and "whoosh": SFM Junos ships a pad
# patch called Sweep sampled across the keyboard (04. Pads/Sweep/, 85
# files), and a word here beats the multisample shape, so only words
# that are never a patch name belong. Added when fx stopped being a
# category (2026-09-02): these words used to be swallowed by that
# non-answer.
[[category]]
id      = "one-shots"
aliases = [
  "riser", "risers", "uplifter", "uplifters",
  "downlifter", "downlifters",
  "impact", "impacts",
  "transition", "transitions", "spinback", "spinbacks",
]
